<div class="cover{% if g.cover_url %} cover--image{% endif %}" style="--hue: {{ g.color }}">{% if g.cover_url %}<img class="game-cover-image" src="{{ g.cover_url }}" alt="{{ g.title }} game artwork" loading="lazy" decoding="async" referrerpolicy="no-referrer">{% endif %}<div class="cover-top"><span>SAVE ONE ARCHIVE</span><span>{{ g.year }}</span></div><div class="cover-art" aria-hidden="true"><span>{{ g.icon }}</span></div><div class="cover-title">{{ g.title }}</div><div class="cover-bottom"><span>{{ g.genre }}</span><span>◆</span></div></div>
